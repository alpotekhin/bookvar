<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Model-level KV-cache optimization</title><desc id="desc">Original editorial diagram comparing grouping, cross-layer sharing, latent attention, and recurrent or hybrid architecture changes.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24756a"/></marker><style>.t{font:700 34px Arial;fill:#142522}.h{font:700 21px Arial;fill:#142522}.b{font:17px Arial;fill:#314743}.s{font:15px Arial;fill:#526763}.c{fill:#f5fbf9;stroke:#24756a;stroke-width:3}.e{fill:#eef4ff;stroke:#496da8;stroke-width:2}.l{stroke:#24756a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="55" y="60" class="t">Model-level: изменить представление состояния</text><text x="55" y="92" class="s">Это свойство обученной архитектуры, а не runtime-переключатель</text>
  <rect x="55" y="235" width="220" height="125" rx="16" class="c"/><text x="88" y="280" class="h">Transformer</text><text x="88" y="314" class="b">MHA KV state</text><text x="88" y="340" class="b">per layer × head</text>
  <path d="M275 297H350" class="l"/>
  <g transform="translate(350 115)"><rect width="300" height="105" rx="14" class="e"/><text x="24" y="38" class="h">Intra-layer grouping</text><text x="24" y="70" class="b">MQA / GQA: share K,V heads</text></g>
  <g transform="translate(350 245)"><rect width="300" height="105" rx="14" class="e"/><text x="24" y="38" class="h">Cross-layer sharing</text><text x="24" y="70" class="b">reuse state across blocks</text></g>
  <g transform="translate(350 375)"><rect width="300" height="105" rx="14" class="e"/><text x="24" y="38" class="h">Latent attention</text><text x="24" y="70" class="b">MLA: cache compressed latent</text></g>
  <g transform="translate(765 180)"><rect width="330" height="105" rx="14" class="e"/><text x="24" y="38" class="h">Recurrent / hybrid state</text><text x="24" y="70" class="b">bounded or selective memory</text></g>
  <g transform="translate(765 330)"><rect width="330" height="105" rx="14" class="c"/><text x="24" y="38" class="h">Smaller residency</text><text x="24" y="70" class="b">but model compatibility changes</text></g>
  <path d="M650 168H715V232H765M650 297H715V232M650 427H715V382H765M1095 232H1140V382H1095" class="l"/>
  <text x="55" y="605" class="s">Источник фактов: Li et al., arXiv:2412.19442, §5 и Fig. 5. Схема и композиция Bookvar; внешнее artwork не использовано.</text>
</svg>
