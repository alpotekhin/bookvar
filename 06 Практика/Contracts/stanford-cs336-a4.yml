  "commands": {
    "setup": "uv sync --frozen",
    "upstream_tests": "uv run pytest",
    "smoke_pipeline": "uv run python -m bookvar_data.pipeline --config configs/smoke-baseline.yml && uv run python -m bookvar_data.pipeline --config configs/smoke-candidate.yml",
    "tokenize": "uv run python -m bookvar_data.tokenize --config configs/tokenize.yml",
    "train_compare": "uv run python -m bookvar_data.train_compare --config configs/fixed-budget.yml",
    "validate_evidence": "uv run python -m bookvar_data.validate_evidence evidence",
    "reproducibility": "uv run python -m bookvar_data.reproduce --config configs/smoke-baseline.yml --compare-hashes evidence/artifact_hashes.json",
    "cleanup": "uv run python -m bookvar_data.cleanup --config configs/smoke-baseline.yml"
  },
  "pipeline_invariants": {
    "raw_inputs_immutable": true,
    "each_stage_writes_new_outputs": true,
    "terminal_states": ["retained", "modified", "dropped", "quarantined"],
    "every_input_has_exactly_one_terminal_state": true,
    "all_rules_and_models_versioned": true,
    "random_seeds_recorded": true,
    "dedup_representative_rule": "minimum immutable document ID per connected component",
    "validation_content_may_be_used_as_train": false
  },
  "deduplication": {
    "exact": {
      "normalization_version_required": true,
      "collision_confirmation_required": true,
      "frequency_and_origin_log_required": true
    },
    "fuzzy": {
      "word_ngram_length_required": true,
      "num_hashes_required": true,
      "num_bands_required": true,
      "hash_seeds_required": true,
      "candidate_formula": "P_candidate(s) = 1 - (1 - s^r)^b",
      "exact_jaccard_verification_required": true,
      "connected_components_required": true,
      "precision_recall_audit_required": true
    }
  },
  "manual_audit": {
    "path": "evidence/manual_audit.csv",
    "stratify_by": ["stage", "action", "language", "domain", "document_length_bucket"],
    "required_actions": ["retained", "modified", "dropped"],
    "required_columns": [
      "doc_id", "stage", "action", "source_excerpt", "prediction", "score",
      "threshold", "human_label", "error_type", "reason", "reviewer"
    ],
    "error_types": ["true_positive", "true_negative", "false_positive", "false_negative", "uncertain"]
  },
  "decision_log": {
    "path": "evidence/decision_log.jsonl",
    "required_columns": [
      "doc_id", "immutable_source_reference", "stage", "action",
      "score_or_rule", "rule_or_classifier_revision", "reason",
      "input_sha256", "output_sha256"
    ]
  },
  "dedup_cluster_log": {
    "path": "evidence/dedup_clusters.jsonl",
    "required_columns": [
      "candidate_method", "exact_jaccard", "component_id",
      "representative_rule", "retained_document_id"
    ]
  },
  "fixed_budget_comparison": {
    "variants": ["baseline", "candidate"],
    "must_hold_constant": [
      "raw_source_manifest", "tokenizer", "packing_policy", "model_shape",
      "initialization_seed", "optimizer", "learning_rate_schedule",
      "context_length", "batch_size", "sampled_training_tokens",
      "validation_corpus", "evaluation_cadence"
    ],
    "required_metrics": [
      "learning_curve", "best_validation_loss", "final_validation_loss",
      "validation_loss_by_domain", "retained_documents", "retained_unique_tokens",
      "actual_source_exposures", "wall_time_seconds", "throughput"
    ],
    "absolute_loss_threshold": null,
    "negative_result_is_allowed": true
  },
  "course_reference_configuration": {
    "reference_only": true,
    "model": "GPT-2-small-shaped approximately 430M parameters",
    "hardware": "8 B200 GPUs",
    "context_length": 512,
    "optimization_steps": 16384,
    "batch_size_per_device": 128,
    "sampled_training_tokens": "approximately 2^33 = 8.6B",
    "reported_wall_time": "approximately 2 hours",
